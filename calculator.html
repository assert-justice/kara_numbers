<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kara Number Calculator</title>
  <link rel="stylesheet" href="index.css" type="text/css">
</head>
<body>
    <h1>Kara Number Calculator</h1>
    <label for="value">Value:</label>
    <input type="number" id="value" name="value" value="100" min="-2176782335" max="2176782335"/>
    <label for="bg-color">Background Color:</label>
    <input type="color" id="bg-color" name="bg-color" value="#00000000"/>
    <label for="strokecolor">Stroke Color:</label>
    <input type="color" id="stroke-color" name="stroke-color" value="#C1AB00"/>
    <div id = "root"></div>
</body>
<script src="index.js"></script>
<script>calculator();</script>
</html>
